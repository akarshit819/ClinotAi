name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          # Hermetic CI: no real credentials. The test suite already forces
          # OPENROUTER_API_KEY="" per file; the build needs no live secrets.
          OPENROUTER_API_KEY: ""
          NEXT_PUBLIC_APP_URL: http://localhost:3000
